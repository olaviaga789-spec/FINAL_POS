.filter-bar{display:flex;align-items:center;gap:10px;padding:14px 24px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.status-tab{padding:6px 16px;border-radius:100px;font-size:12px;font-weight:600;background:var(--bg-main);border:1.5px solid var(--border);color:var(--text-mid);cursor:pointer;transition:var(--t,0.18s)}

<script>
const API_ORDERS = './php/orders.php';
const API_REPORT = './php/report.php';
const IS_LOCAL   = location.protocol === 'file:';
let allOrders = [], currentStatus = 'all';

document.addEventListener('DOMContentLoaded', loadOrders);

async function loadOrders(){
  startLoad();
  if(IS_LOCAL){ showNotice(false,'⚠ Demo mode — open via http://localhost/pos/ for live data.'); renderDemoOrders(); stopLoad(); return; }
  try {
    const orders = await fetch(API_ORDERS+'?action=list').then(r=>r.json());
    allOrders = orders;
    showNotice(true);
    renderSummary(orders);
    renderTable(filtered());
  } catch(e){ showNotice(false,'⚠ Cannot reach database.'); renderDemoOrders(); }
  stopLoad();
}

function setStatus(s,btn){ currentStatus=s; document.querySelectorAll('.status-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); renderTable(filtered()); }
function filtered(){
  let list = allOrders;
  if(currentStatus!=='all') list=list.filter(o=>o.status===currentStatus);
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  if(q) list=list.filter(o=>String(o.id).includes(q)||(o.customer_name||'').toLowerCase().includes(q)||(o.order_type||'').toLowerCase().includes(q));
  return list;
}
function filterOrders(){ renderTable(filtered()); }

function renderSummary(orders){
  const today=new Date().toDateString();
  const t=orders.filter(o=>new Date(o.created_at).toDateString()===today);
  const rev=t.filter(o=>o.status==='completed').reduce((s,o)=>s+(+o.total),0);
  document.getElementById('sTodayOrders').textContent=t.length;
  document.getElementById('sTodayRevenue').textContent='₱'+fmt(rev);
  document.getElementById('sPending').textContent=t.filter(o=>o.status==='pending').length;
  document.getElementById('sCompleted').textContent=t.filter(o=>o.status==='completed').length;
  document.getElementById('sCancelled').textContent=t.filter(o=>o.status==='cancelled').length;
}

function renderTable(orders){
  document.getElementById('orderCount').textContent=orders.length+' order'+(orders.length!==1?'s':'');
  const tbody=document.getElementById('ordersBody');
  if(!orders.length){ tbody.innerHTML='<tr><td colspan="8"><div class="empty"><div class="empty-icon">🧾</div><h3>No orders found</h3></div></td></tr>'; return; }
  const icon=t=>t==='dine-in'?'🍽️':t==='takeout'?'🥡':'🛵';
  const cls=s=>({completed:'badge-completed',pending:'badge-pending',preparing:'badge-preparing',ready:'badge-ready',cancelled:'badge-cancelled'}[s]||'badge-pending');
  tbody.innerHTML=orders.map(o=>{
    const d=new Date(o.created_at);
    const time=d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
    const date=d.toLocaleDateString('en-PH',{month:'short',day:'numeric'});
    return `<tr>
      <td><span class="order-id">#${o.id}</span></td>
      <td><span class="customer-name">${o.customer_name||'Guest'}</span><br><span style="font-size:11px;color:var(--text-light)">${o.table_number?'Table '+o.table_number:''}</span></td>
      <td>${icon(o.order_type)} ${o.order_type}</td>
      <td style="text-align:center">${o.item_count}</td>
      <td><span class="amt">₱${fmt(o.total)}</span></td>
      <td><span class="badge ${cls(o.status)}">${o.status}</span></td>
      <td style="color:var(--text-light);font-size:12px">${date}<br>${time}</td>
      <td><button class="action-btn" onclick="viewOrder(${o.id})">View</button></td>
    </tr>`;
  }).join('');
}

async function viewOrder(id){
  document.getElementById('modalTitle').textContent='Order #'+id;
  document.getElementById('modalBody').innerHTML='<div style="text-align:center;padding:30px;color:var(--text-light)">Loading...</div>';
  document.getElementById('orderModal').classList.add('open');
  try {
    const o=await fetch(API_ORDERS+'?action=get&id='+id).then(r=>r.json());
    renderModal(o);
  } catch(e){ document.getElementById('modalBody').innerHTML='<p style="padding:20px;color:red">Failed to load.</p>'; }
}

function renderModal(o){
  const icon=t=>t==='dine-in'?'🍽️':t==='takeout'?'🥡':'🛵';
  const cls=s=>({completed:'badge-completed',pending:'badge-pending',preparing:'badge-preparing',ready:'badge-ready',cancelled:'badge-cancelled'}[s]||'badge-pending');
  const d=new Date(o.created_at);
  const btns=[
    {l:'Mark Preparing',v:'preparing',c:''},
    {l:'Mark Ready',    v:'ready',    c:''},
    {l:'Complete ✓',   v:'completed',c:'primary'},
    {l:'Cancel ✗',     v:'cancelled',c:'red'},
  ].filter(b=>b.v!==o.status).map(b=>`<button class="sa-btn ${b.c}" onclick="updateStatus(${o.id},'${b.v}')">${b.l}</button>`).join('');

  const items=(o.items||[]).map(it=>`
    <div class="order-item-row">
      <div><span class="item-qty">${it.qty}×</span>${it.item_name}</div>
      <div class="item-total">₱${fmt(it.subtotal)}</div>
    </div>`).join('')||'<p style="color:var(--text-light);font-size:13px;padding:8px 0">No item details</p>';

  document.getElementById('modalBody').innerHTML=`
    <div>
      <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value"><span class="badge ${cls(o.status)}">${o.status}</span></span></div>
      <div class="detail-row"><span class="detail-label">Customer</span><span class="detail-value">${o.customer_name||'Guest'}</span></div>
      <div class="detail-row"><span class="detail-label">Table</span><span class="detail-value">${o.table_number||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">${icon(o.order_type)} ${o.order_type}</span></div>
      <div class="detail-row"><span class="detail-label">Date & Time</span><span class="detail-value">${d.toLocaleString('en-PH')}</span></div>
      ${o.notes?`<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${o.notes}</span></div>`:''}
    </div>
    <div class="items-section-title">Order Items</div>
    ${items}
    <div class="totals-block">
      <div class="total-line"><span>Subtotal</span><span>₱${fmt(o.subtotal)}</span></div>
      <div class="total-line"><span>VAT (12%)</span><span>₱${fmt(o.tax)}</span></div>
      <div class="total-line grand"><span>Grand Total</span><span>₱${fmt(o.total)}</span></div>
    </div>
    <div class="status-actions">${btns}</div>`;
}

async function updateStatus(id,status){
  try {
    const res=await fetch(API_ORDERS+'?action=status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
    const data=await res.json();
    if(data.success){ closeModal(); loadOrders(); }
  } catch(e){ alert('Failed to update status'); }
}

function showNotice(live,msg=''){
  const el=document.getElementById('dbNotice');
